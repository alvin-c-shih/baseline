[project]
name = "baseline-ml-course"
version = "0.1.0"
description = "Baseline: a first machine-learning course for software developers, told through the music video"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "transformers>=4.50",
    "accelerate>=1.0",
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
    "pyarrow>=17",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["jupytext>=1.16", "nbconvert>=7.16", "nbclient>=0.10", "ipykernel>=6.29"]

[tool.uv]
package = false
